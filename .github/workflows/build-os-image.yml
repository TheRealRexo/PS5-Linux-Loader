name: Build OS image

# Wraps a stock ps5-linux disk image into a ps5-linux "OS image": the image's
# root filesystem gets the M.2 / storage tooling baked in, and a sidecar
# descriptor is published next to the image so the loader WebUI can offer it.
#
# Needs a runner with room for the uncompressed image (the official 12 GB arch
# image decompresses to ~12 GB and recompresses to ~4-5 GB). Raise
# runs-on to a larger runner if a build fails for lack of disk space.

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: Download URL of a ps5-linux .img.xz to wrap
        required: true
        default: https://github.com/ps5-linux/ps5-linux-image/releases/download/latest/ps5-arch.img.xz
      tag:
        description: Release tag to attach the finished OS image to
        required: true
        default: os-image
      asset_name:
        description: Output asset base name
        required: true
        default: ps5-arch-os

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build M.2 / install tooling
        run: make -C tools

      - name: Download source image
        run: |
          set -euo pipefail
          curl -fL "${{ inputs.image_url }}" -o source.img.xz
          unxz -v source.img.xz
          mv source.img os.img
          ls -lh os.img

      - name: Inject tooling + marker
        run: sudo ./tools/inject-os-image.sh --img os.img

      - name: Recompress
        run: xz -T0 -6 os.img

      - name: Sanity check
        run: |
          ls -lh os.img.xz os.img.osimage
          echo "--- descriptor ---"
          cat os.img.osimage

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            os.img.xz
            os.img.osimage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
